plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def generatedScript = layout.buildDirectory.file('generated/download-dependencies.bat')
def runtimeDependencyManifest = rootProject.layout.buildDirectory.file('generated/downloader/runtime-dependencies.tsv')

tasks.register('generateDownloadScript', JavaExec) {
    group = 'distribution'
    description = 'Создаёт BAT для загрузки Java Runtime и библиотек переносимого приложения.'
    dependsOn(tasks.named('classes'))
    dependsOn(':writeRuntimeDependencyManifest')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.restoreyandex.downloader.DownloadScriptGenerator'
    args(generatedScript.get().asFile.absolutePath,
            "yandex-media-recovery-${rootProject.version}.jar",
            runtimeDependencyManifest.get().asFile.absolutePath)
    outputs.file(generatedScript)
}
