plugins {
    id 'application'
    id 'java'
}

group = 'ru.restoreyandex'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.restoreyandex.app.RecoveryApplication'
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'net.java.dev.jna:jna-platform:5.16.0'
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    implementation 'com.microsoft.playwright:playwright:1.58.0'
    implementation 'org.yaml:snakeyaml:2.3'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

// Логотип поставляется вместе с приложением и доступен через classpath в окне Swing.
tasks.named('processResources') {
    from(layout.projectDirectory.file('logo.png'))
}

def exeOutputDirectory = layout.buildDirectory.dir('exe')
def exeApplicationDirectory = layout.buildDirectory.dir('exe/YandexMediaRecovery')
def packagedLibraries = layout.buildDirectory.dir("install/${project.name}/lib")
def runtimeDependencyArtifacts = providers.provider {
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { artifact -> artifact.extension == 'jar' }
            .toList()
            .sort { left, right -> left.file.name <=> right.file.name }
}
def downloadableLibraryNames = providers.provider {
    runtimeDependencyArtifacts.get().collect { artifact -> artifact.file.name }.toSet()
}
def runtimeDependencyManifest = layout.buildDirectory.file('generated/downloader/runtime-dependencies.tsv')
def releaseArtifactVersion = providers.gradleProperty('releaseVersion').getOrElse(project.version.toString())
def packagingLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

/** Собирает URL и имена всех JAR, разрешённых Gradle для запуска приложения. */
tasks.register('writeRuntimeDependencyManifest') {
    group = 'distribution'
    description = 'Формирует манифест Maven-зависимостей для компактного загрузчика.'
    inputs.files(configurations.runtimeClasspath)
    outputs.file(runtimeDependencyManifest)

    doLast {
        List artifacts = runtimeDependencyArtifacts.get()
        Set fileNames = artifacts.collect { artifact -> artifact.file.name } as Set
        if (artifacts.isEmpty() || fileNames.size() != artifacts.size()) {
            throw new GradleException('Невозможно сформировать однозначный список JAR-зависимостей для загрузчика.')
        }
        String manifest = artifacts.collect { artifact ->
            def module = artifact.moduleVersion.id
            def groupPath = module.group.replace('.', '/')
            def url = "https://repo.maven.apache.org/maven2/${groupPath}/${artifact.name}/${module.version}/${artifact.file.name}"
            "${url}\t${artifact.file.name}"
        }.join(System.lineSeparator()) + System.lineSeparator()
        File output = runtimeDependencyManifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(manifest, 'UTF-8')
    }
}

/**
 * Собирает переносимое Windows-приложение с собственным Java Runtime.
 * Итоговый файл: build/exe/YandexMediaRecovery/YandexMediaRecovery.exe.
 */
tasks.register('packageExe', Exec) {
    group = 'distribution'
    description = 'Создаёт автономный Windows EXE с Java Runtime через jpackage.'
    dependsOn(tasks.named('installDist'))
    inputs.dir(packagedLibraries)
    outputs.dir(exeOutputDirectory)

    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('packageExe поддерживается только в Windows.')
        }
        File jdkDirectory = packagingLauncher.get().metadata.installationPath.asFile
        File jpackage = new File(jdkDirectory, 'bin/jpackage.exe')
        if (!jpackage.isFile()) {
            throw new GradleException("В JDK 21 не найден jpackage: ${jpackage}")
        }
        project.delete(exeOutputDirectory)
        executable(jpackage.absolutePath)
        args(
                '--type', 'app-image',
                '--dest', exeOutputDirectory.get().asFile.absolutePath,
                '--name', 'YandexMediaRecovery',
                '--app-version', project.version.toString(),
                '--input', packagedLibraries.get().asFile.absolutePath,
                '--main-jar', "${project.name}-${project.version}.jar",
                '--main-class', application.mainClass.get()
        )
    }
}

/** Упаковывает целую папку приложения, потому что launcher EXE требует app/*.cfg и runtime рядом с собой. */
tasks.register('packageWindowsZip', Zip) {
    group = 'distribution'
    description = 'Создаёт переносимый ZIP с EXE, настройками launcher и Java Runtime.'
    dependsOn(tasks.named('packageExe'))
    archiveFileName = "YandexMediaRecovery-${project.version}-windows.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
    from(exeApplicationDirectory) {
        into('YandexMediaRecovery')
    }
}

/**
 * Упаковывает компактную поставку. После распаковки пользователь запускает
 * download-dependencies.bat: он скачивает Java Runtime и библиотеки рядом с EXE.
 */
tasks.register('packageBootstrapZip', Zip) {
    group = 'distribution'
    description = 'Создаёт компактный ZIP с EXE и BAT для загрузки зависимостей при первом запуске.'
    dependsOn(tasks.named('packageExe'))
    dependsOn(':downloader:generateDownloadScript')
    archiveFileName = "YandexMediaRecovery-${releaseArtifactVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
    from(exeApplicationDirectory) {
        into('YandexMediaRecovery')
        exclude('runtime/**')
        exclude { details ->
            details.path.startsWith('app/') && downloadableLibraryNames.get().contains(details.file.name)
        }
    }
    from(layout.projectDirectory.file('downloader/build/generated/download-dependencies.bat')) {
        into('YandexMediaRecovery')
    }
}

// Обычная команда сборки выпускает launcher и готовый переносимый архив.
tasks.named('build') {
    dependsOn(tasks.named('packageExe'))
    dependsOn(tasks.named('packageWindowsZip'))
    dependsOn(tasks.named('packageBootstrapZip'))
}
