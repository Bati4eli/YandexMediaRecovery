plugins {
    id 'application'
    id 'java'
}

group = 'ru.restoreyandex'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ru.restoreyandex.app.RecoveryApplication'
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.16.0'
    implementation 'net.java.dev.jna:jna-platform:5.16.0'
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    implementation 'com.microsoft.playwright:playwright:1.58.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

// Логотип поставляется вместе с приложением и доступен через classpath в окне Swing.
tasks.named('processResources') {
    from(layout.projectDirectory.file('logo.png'))
}

def exeOutputDirectory = layout.buildDirectory.dir('exe')
def packagedLibraries = layout.buildDirectory.dir("install/${project.name}/lib")
def packagingLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

/**
 * Собирает переносимое Windows-приложение с собственным Java Runtime.
 * Итоговый файл: build/exe/YandexMediaRecovery/YandexMediaRecovery.exe.
 */
tasks.register('packageExe', Exec) {
    group = 'distribution'
    description = 'Создаёт автономный Windows EXE с Java Runtime через jpackage.'
    dependsOn(tasks.named('installDist'))
    inputs.dir(packagedLibraries)
    outputs.dir(exeOutputDirectory)

    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('packageExe поддерживается только в Windows.')
        }
        File jdkDirectory = packagingLauncher.get().metadata.installationPath.asFile
        File jpackage = new File(jdkDirectory, 'bin/jpackage.exe')
        if (!jpackage.isFile()) {
            throw new GradleException("В JDK 21 не найден jpackage: ${jpackage}")
        }
        project.delete(exeOutputDirectory)
        executable(jpackage.absolutePath)
        args(
                '--type', 'app-image',
                '--dest', exeOutputDirectory.get().asFile.absolutePath,
                '--name', 'YandexMediaRecovery',
                '--app-version', project.version.toString(),
                '--input', packagedLibraries.get().asFile.absolutePath,
                '--main-jar', "${project.name}-${project.version}.jar",
                '--main-class', application.mainClass.get()
        )
    }
}

/** Упаковывает целую папку приложения, потому что launcher EXE требует app/*.cfg и runtime рядом с собой. */
tasks.register('packageWindowsZip', Zip) {
    group = 'distribution'
    description = 'Создаёт переносимый ZIP с EXE, настройками launcher и Java Runtime.'
    dependsOn(tasks.named('packageExe'))
    archiveFileName = "YandexMediaRecovery-${project.version}-windows.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
    from(exeOutputDirectory) {
        into('YandexMediaRecovery')
    }
}

// Обычная команда сборки выпускает launcher и готовый переносимый архив.
tasks.named('build') {
    dependsOn(tasks.named('packageExe'))
    dependsOn(tasks.named('packageWindowsZip'))
}
